<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1235" viewBox="0 0 1480 1235" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama entidade-relacionamento do GreenER</title>
  <desc id="desc">Sete tabelas do PostgreSQL com colunas, tipos, chaves e cardinalidades. Cinco tabelas compõem o fluxo de coleta. Usuário e configuração ficam em uma área separada.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #182e2d; }
    .title { font-size: 40px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #476662; }
    .section { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #2d6760; }
    .table { font: 700 20px Consolas, monospace; fill: white; }
    .field { font: 15px Consolas, monospace; }
    .type { font: 13px Consolas, monospace; fill: #43615e; text-anchor: end; }
    .tag { font: 700 12px Consolas, monospace; text-anchor: middle; fill: #176252; }
    .optional { fill: #5d4b89; }
    .edge { fill: none; stroke: #32746c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dashed { stroke: #6a5599; stroke-dasharray: 5 4; }
    .cardinality { font: 700 14px Consolas, monospace; fill: #215e57; paint-order: stroke; stroke: #f4f9f8; stroke-width: 6px; }
    .cardinality.optional { fill: #5d4b89; }
    .note { font-size: 15px; fill: #476662; }
  </style>
